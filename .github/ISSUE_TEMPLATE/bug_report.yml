name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! The audit tab (per window) has a "Copy JSON"
        button — pasting the relevant tool-call entry speeds up repro a lot.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open workspace ...
        2. Ask Commander ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model + endpoint
      description: e.g. qwen2.5-coder:7b @ Ollama, claude-sonnet @ api.anthropic.com
    validations:
      required: true
  - type: textarea
    id: audit
    attributes:
      label: Audit trail (optional)
      description: Paste the relevant entry from the Audit tab → Copy JSON.
      render: json
  - type: markdown
    attributes:
      value: |
        ### Three quick questions

        These are the questions that tell us most. One line each is plenty.
  - type: textarea
    id: first-task
    attributes:
      label: What did you ask it to do first, and did it do it?
      placeholder: e.g. "Summarise this repo — yes / no, it read the README and stopped."
  - type: textarea
    id: gate
    attributes:
      label: Where did it stop and ask for permission, and was that the right moment?
      placeholder: e.g. "It asked before writing src/main.rs. Right call, but it also asked before reading a file inside the workspace, which felt like too much."
  - type: textarea
    id: teach
    attributes:
      label: What did you have to teach it that it should have known?
      placeholder: e.g. "That our tests need `pnpm test:unit`, not `npm test`."
