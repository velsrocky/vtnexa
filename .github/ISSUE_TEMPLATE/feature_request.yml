name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or pain, not the implementation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How would you like it to work?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Commander/agent, Review gate/diffs, Editor, Terminal/PTY, Git, Browser Use, Skills/routines, Windows/sessions, Packaging, Other]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
