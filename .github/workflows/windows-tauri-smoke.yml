name: Windows Tauri Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Real Windows Tauri WebDriver smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install and test the verified sidecar runtime
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir sidecar/browser install --prod --ignore-scripts
          pnpm test:provision
          pnpm test:sidecar
          pnpm test:node
          pnpm run stage-sidecar

      - uses: dtolnay/rust-toolchain@stable

      - name: Locate the Windows signing tool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $command = Get-Command signtool.exe -ErrorAction SilentlyContinue
          $path = if ($null -ne $command) { $command.Source } else { $null }
          if ($null -eq $path) {
            $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            foreach ($root in $roots) {
              $kitRoot = Join-Path $root "Windows Kits\10\bin"
              if (Test-Path -LiteralPath $kitRoot) {
                $candidate = Get-ChildItem -LiteralPath $kitRoot -Filter "signtool.exe" -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
                if ($null -ne $candidate) { $path = $candidate.FullName; break }
              }
            }
          }
          if ([string]::IsNullOrWhiteSpace($path)) { throw "signtool.exe was not found" }
          "TAURI_WINDOWS_SIGNTOOL_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install tauri-driver 2.0.6
        shell: pwsh
        run: cargo install tauri-driver --version 2.0.6 --locked --force

      - name: Install matching msedgedriver from pinned tool revision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo install --locked --force --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 msedgedriver-tool --version 0.2.2
          & "$HOME\.cargo\bin\msedgedriver-tool.exe"
          $driver = Join-Path (Get-Location) "msedgedriver.exe"
          if (-not (Test-Path -LiteralPath $driver -PathType Leaf)) {
            throw "msedgedriver-tool did not produce msedgedriver.exe"
          }
          "TAURI_DRIVER_NATIVE_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the real Windows Tauri app and bundles
        shell: pwsh
        run: pnpm tauri build --bundles "nsis,msi"  --config .github/smoke-config.json

      - name: Verify bundle outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $PWD "src-tauri\target\release"
          $app = Join-Path $root "vtnexa.exe"
          $nsis = @(Get-ChildItem -LiteralPath (Join-Path $root "bundle\nsis") -Filter "*-setup.exe" -File)
          $msi = @(Get-ChildItem -LiteralPath (Join-Path $root "bundle\msi") -Filter "*.msi" -File)
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) { throw "built Tauri executable is missing" }
          if ($nsis.Count -eq 0) { throw "NSIS bundle is missing" }
          if ($msi.Count -eq 0) { throw "MSI bundle is missing" }
          "TAURI_SMOKE_APP=$app" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Drive the built WebView2 app with tauri-driver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:TAURI_DRIVER_BIN = Join-Path $HOME ".cargo\bin\tauri-driver.exe"
          node scripts/tauri-windows-smoke.mjs --app $env:TAURI_SMOKE_APP --timeout-ms 120000
