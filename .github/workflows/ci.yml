name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ESLint (zero warnings tolerated)
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Unit tests + coverage ratchet
        run: pnpm exec vitest run --coverage

      - name: E2E (chromium against the web build)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The tauri build-script validates bundle resource paths exist
      # (sidecar-stage/ and ../dist are gitignored build outputs); clippy and
      # test never bundle, so empty stubs suffice (release stages the real
      # sidecar and builds dist via beforeBuildCommand).
      - name: Stub gitignored bundle resource paths
        run: mkdir -p dist src-tauri/sidecar-stage/browser

      - name: rustfmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    name: Build & release (tags only)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, backend]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tauri-action runs the CLI directly, so npm's pre-hooks never fire —
      # the gitignored sidecar staging has to be built explicitly.
      - name: Stage browser sidecar
        run: |
          cd sidecar/browser
          pnpm install --prod --ignore-scripts
          cd ../..
          pnpm run stage-sidecar

      - uses: dtolnay/rust-toolchain@stable

      # Signing is opt-in: tauri-action treats a SET-but-empty APPLE_CERTIFICATE
      # as "sign me" and dies importing nothing, so only non-empty secrets are
      # exported. While unset the release ships unsigned (SmartScreen /
      # Gatekeeper warn; see docs/RELEASE.md "Signing & updater"). When the
      # updater private key IS set, also add `createUpdaterArtifacts: "true"`
      # below after enabling the updater plugin in tauri.conf.json.
      - name: Export signing credentials when configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # NOTE: default step shell is PowerShell on windows-latest; force bash
        # (values like private keys are multiline - heredoc keeps them intact).
        shell: bash
        run: |
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            val="${!v}"
            if [ -n "$val" ]; then
              printf '%s<<GITHUB_ENV_EOF\n%s\nGITHUB_ENV_EOF\n' "$v" "$val" >> "$GITHUB_ENV"
            fi
          done

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "VTNexa v__VERSION__"
          releaseBody: "See the changelog for what shipped."
          releaseDraft: true
          prerelease: false
          createUpdaterArtifacts: "true"
