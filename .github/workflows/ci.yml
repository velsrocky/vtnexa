name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: ESLint (zero warnings tolerated)
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Unit tests + coverage ratchet
        run: pnpm exec vitest run --coverage

      - name: Node runtime, sidecar, and release tests
        run: |
          pnpm --dir sidecar/browser install --prod --ignore-scripts
          pnpm test:provision
          pnpm test:sidecar
          pnpm test:node

      - name: E2E (chromium against the web build)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust dependency audit
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Stub gitignored bundle resource paths
        run: mkdir -p dist src-tauri/sidecar-stage/browser

      - name: rustfmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  tauri-smoke:
    name: Real-backend Linux Tauri WebDriver smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Tauri + WebDriver system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            xvfb
          # The WebDriver package was renamed in Ubuntu 26.04.
          sudo apt-get install -y webkit2gtk-driver || sudo apt-get install -y webkitgtk-webdriver

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tauri-driver 2.0.6
        run: cargo install tauri-driver --version 2.0.6 --locked --force

      - name: Stage the browser sidecar (required by bundle.resources)
        run: |
          pnpm --dir sidecar/browser install --prod --ignore-scripts
          pnpm run stage-sidecar

      - name: Build the real Tauri app (frontend embedded)
        run: pnpm exec tauri build --debug --no-bundle

      - name: Drive the built WebKitGTK app with tauri-driver
        run: scripts/tauri-smoke.sh --require --app "$PWD/src-tauri/target/debug/vtnexa"

  release-preflight:
    name: Release version and signing preflight
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, backend, tauri-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate and export the Apple signing material
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/apple-signing.mjs --export-github-env

      - name: Require exact tag and release signing material
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: node scripts/release-preflight.mjs --tag "$GITHUB_REF_NAME"

  release:
    name: Build draft release (tags only)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, backend, release-preflight]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stage and test the browser sidecar
        shell: bash
        run: |
          set -euo pipefail
          cd sidecar/browser
          pnpm install --prod --ignore-scripts
          cd ../..
          pnpm test:provision
          pnpm test:sidecar
          pnpm test:node
          pnpm run stage-sidecar

      - uses: dtolnay/rust-toolchain@stable

      - name: Import Windows code-signing certificate
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfxPath = Join-Path $env:RUNNER_TEMP "vtnexa-signing.pfx"
          try {
            $encoded = $env:WINDOWS_CERTIFICATE -replace '\s', ''
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($encoded))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Where-Object { $_.HasPrivateKey })
            # Read the code-signing EKU from the extension itself. On
            # PowerShell 7 `EnhancedKeyUsageList` yields
            # EnhancedKeyUsageRepresentation objects whose Value/Oid are
            # empty and whose ObjectId does not exist, so the older
            # `$_.ObjectId.Value` expression never matched and this step
            # threw "PFX did not contain a code-signing certificate" even for
            # a perfectly valid PFX. The extension's EnhancedKeyUsages
            # collection is a plain OidCollection in every PowerShell version.
            $cert = $certificates | Where-Object { $_.Extensions | Where-Object { $_.Oid.Value -eq "2.5.29.37" } | ForEach-Object { $_.EnhancedKeyUsages } | ForEach-Object { $_.Value } | Where-Object { $_ -eq "1.3.6.1.5.5.7.3.3" } } | Select-Object -First 1
            if ($null -eq $cert) { throw "PFX did not contain a code-signing certificate with a private key" }
            $thumbprint = $cert.Thumbprint
            if ([string]::IsNullOrWhiteSpace($thumbprint)) { throw "PFX certificate thumbprint is empty" }
            "WINDOWS_CERTIFICATE_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Locate the Windows signing tool
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $command = Get-Command signtool.exe -ErrorAction SilentlyContinue
          $path = if ($null -ne $command) { $command.Source } else { $null }
          if ($null -eq $path) {
            $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            foreach ($root in $roots) {
              $kitRoot = Join-Path $root "Windows Kits\10\bin"
              if (Test-Path -LiteralPath $kitRoot) {
                $candidate = Get-ChildItem -LiteralPath $kitRoot -Filter "signtool.exe" -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
                if ($null -ne $candidate) { $path = $candidate.FullName; break }
              }
            }
          }
          if ([string]::IsNullOrWhiteSpace($path)) { throw "signtool.exe was not found" }
          "SIGNTOOL_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_WINDOWS_SIGNTOOL_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Export updater signing credentials
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            val="${!v}"
            if [ -n "$val" ]; then
              printf '%s<<GITHUB_ENV_EOF\n%s\nGITHUB_ENV_EOF\n' "$v" "$val" >> "$GITHUB_ENV"
            fi
          done

      - name: Export macOS signing and notarization credentials
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -e
          # macOS signing and notarization are MANDATORY for a public release:
          # an ad-hoc or unsigned build is blocked by Gatekeeper, and Tauri
          # cannot update an unsigned macOS app. This fails closed BEFORE the
          # build, so a release can never be produced without them.
          #
          # The script writes the credentials to $GITHUB_ENV, materialises the
          # App Store Connect .p8 when that route is used, and exports
          # APPLE_API_KEY_PATH for Tauri. It reports names only.
          node scripts/apple-signing.mjs --export-github-env
          # Tauri imports the .p12 itself. Do NOT also set
          # APPLE_SIGNING_IDENTITY in CI: Tauri fails the build when a
          # supplied identity does not match the imported certificate.

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "VTNexa ${{ github.ref_name }}"
          releaseBody: "See the changelog for what shipped."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          createUpdaterArtifacts: "true"
          uploadUpdaterSignatures: true

  release-verify-windows:
    name: Verify signed Windows artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Download the unpublished draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $release = gh release view "$env:GITHUB_REF_NAME" --json isDraft,assets | ConvertFrom-Json
          if (-not $release.isDraft) { throw "release is not a draft" }
          $directory = Join-Path $env:RUNNER_TEMP "vtnexa-release-assets"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $assetMapPath = Join-Path $env:RUNNER_TEMP "vtnexa-release-asset-map.json"
          $assetMap = @{}
          foreach ($asset in $release.assets) { $assetMap[[string]$asset.id] = [string]$asset.name }
          $assetMap | ConvertTo-Json -Compress | Set-Content -LiteralPath $assetMapPath -Encoding utf8NoBOM
          gh release download "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --dir $directory --clobber
          "RELEASE_DOWNLOAD_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ASSET_MAP=$assetMapPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify updater manifest and artifact set
        shell: pwsh
        run: node scripts/verify-release.mjs --directory "$env:RELEASE_DOWNLOAD_DIR" --tag "$env:GITHUB_REF_NAME" --asset-map "$env:RELEASE_ASSET_MAP" --repository "$env:GITHUB_REPOSITORY"

      - name: Import the expected Windows certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfxPath = Join-Path $env:RUNNER_TEMP "vtnexa-verify.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String(($env:WINDOWS_CERTIFICATE -replace '\s', '')))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Where-Object { $_.HasPrivateKey })
            # Read the code-signing EKU from the extension itself. On
            # PowerShell 7 `EnhancedKeyUsageList` yields
            # EnhancedKeyUsageRepresentation objects whose Value/Oid are
            # empty and whose ObjectId does not exist, so the older
            # `$_.ObjectId.Value` expression never matched and this step
            # threw "PFX did not contain a code-signing certificate" even for
            # a perfectly valid PFX. The extension's EnhancedKeyUsages
            # collection is a plain OidCollection in every PowerShell version.
            $cert = $certificates | Where-Object { $_.Extensions | Where-Object { $_.Oid.Value -eq "2.5.29.37" } | ForEach-Object { $_.EnhancedKeyUsages } | ForEach-Object { $_.Value } | Where-Object { $_ -eq "1.3.6.1.5.5.7.3.3" } } | Select-Object -First 1
            if ($null -eq $cert) { throw "expected code-signing certificate was not imported" }
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify Windows Authenticode and trusted timestamps
        shell: pwsh
        env:
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          & pwsh -NoLogo -NoProfile -NonInteractive -File scripts/verify-windows-signature.ps1 -Directory "$env:RELEASE_DOWNLOAD_DIR" -Thumbprint "$env:WINDOWS_CERTIFICATE_THUMBPRINT" -TimestampUrl "$env:WINDOWS_TIMESTAMP_URL"

  release-verify-macos:
    name: Verify signed and notarized macOS artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Download the unpublished draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets)"
          if [ "$(printf '%s' "$release_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).isDraft))')" != "true" ]; then
            echo "release is not a draft" >&2
            exit 1
          fi
          directory="$RUNNER_TEMP/vtnexa-release-assets"
          mkdir -p "$directory"
          printf '%s' "$release_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m={};for(const a of JSON.parse(s).assets)m[String(a.id)]=a.name;require("fs").writeFileSync(process.argv[1],JSON.stringify(m))})' "$RUNNER_TEMP/vtnexa-release-asset-map.json"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$directory" --clobber
          echo "RELEASE_DOWNLOAD_DIR=$directory" >> "$GITHUB_ENV"

      - name: Verify Developer ID signature, Gatekeeper acceptance and stapled ticket
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # The .app.tar.gz holds the app bundle; the .dmg is the installer.
          # Verify the bundle the updater ships - that is what a user runs.
          workdir="$RUNNER_TEMP/vtnexa-macos-verify"
          rm -rf "$workdir"
          mkdir -p "$workdir"
          for archive in "$RELEASE_DOWNLOAD_DIR"/*.app.tar.gz; do
            [ -e "$archive" ] || continue
            tar xzf "$archive" -C "$workdir"
          done
          bundle="$(find "$workdir" -maxdepth 2 -name '*.app' -type d | head -n 1)"
          if [ -z "$bundle" ]; then
            echo "::error::no macOS .app bundle found in the release assets"
            exit 1
          fi
          node scripts/apple-signing.mjs --bundle "$bundle" --team "$APPLE_TEAM_ID"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          spctl --assess --type execute --verbose=4 "$bundle"
          xcrun stapler validate "$bundle"

  release-publish:
    name: Publish the verified draft
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-verify-windows, release-verify-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish only after every platform verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "release stopped being a draft" >&2
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
